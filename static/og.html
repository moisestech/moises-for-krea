<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moises Sanabria x Krea</title>
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #F2F0E9;
        color: #151515;
        font-family: Georgia, serif;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        overflow: hidden;
      }
      .copy { padding: 64px 48px; }

      p { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; max-width: 32ch; }
      .stamp {
        font-family: ui-monospace, monospace;
        font-size: 15px;
        border: 1px solid #151515;
        display: inline-block;
        padding: 8px 12px;
        margin-top: 20px;
      }
      .art {
        background: #151515 url("https://res.cloudinary.com/dck5rzi4h/image/upload/c_fill,w_720,h_630,g_auto/v1738035709/art/moisestech-website/price_of_existence_wideshot.png") center/cover;
        position: relative;
      }
      .art span {
        position: absolute;
        left: 24px;
        bottom: 24px;
        color: #F2F0E9;
        font-family: ui-monospace, monospace;
        background: #151515;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <p class="kicker">CREATIVE LEAD APPLICATION</p>
      <h1>Workflows people can trust, learn, and ship with.</h1>
      <p>Unofficial Field Studio replay. No login. No spend.</p>
